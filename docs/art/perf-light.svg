<svg xmlns="http://www.w3.org/2000/svg" width="760" height="328" viewBox="0 0 760 328" role="img" aria-labelledby="t d">
  <title id="t">Orbit Disk speed</title>
  <desc id="d">95,000 files/s found on a whole Mac (Apple M5 · 5.1 million files in 55 s). 60–82 s to a saved map (all 5.1 M indexed); 10 ms to first view (fills in as it scans); 120 Hz smooth UI (p99 interval 6.2 ms). Files are what a scan without Full Disk Access could read; 10 ms is the scan engine’s first view. The p99 frame interval is from the 0.10.0 release measurements; a 120 Hz frame allows 8.3 ms.</desc>
  <defs>
    <linearGradient id="spot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFEDE4"/><stop offset=".5" stop-color="#F6F1FA"/><stop offset="1" stop-color="#E6ECFF"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="0.5" y="0.5" width="759.0" height="159" rx="16" fill="url(#spot)" stroke="#000000" stroke-opacity=".07"/>
    <rect x="24.0" y="22" width="28" height="4" rx="2" fill="#D4562D"/>
    <text x="24.0" y="84" fill="#1F2328" font-size="56" font-weight="600" letter-spacing="-.8">95,000 files/s</text>
    <text x="24.0" y="116" fill="#31363C" font-size="23" font-weight="600">found on a whole Mac</text>
    <text x="24.0" y="142" fill="#59636E" font-size="21">Apple M5 · 5.1 million files in 55 s</text>
    <rect x="0.5" y="172.5" width="244.3" height="155" rx="16" fill="#F6F8FA" fill-opacity="1" stroke="#D1D9E0" stroke-opacity="1"/>
    <rect x="24.0" y="194" width="28" height="4" rx="2" fill="#D4562D"/>
    <text x="24.0" y="244" fill="#1F2328" font-size="36" font-weight="600" letter-spacing="-.8">60–82 s</text>
    <text x="24.0" y="278" fill="#31363C" font-size="23" font-weight="600">to a saved map</text>
    <text x="24.0" y="306" fill="#59636E" font-size="20">all 5.1 M indexed</text>
    <rect x="257.8" y="172.5" width="244.3" height="155" rx="16" fill="#F6F8FA" fill-opacity="1" stroke="#D1D9E0" stroke-opacity="1"/>
    <rect x="281.3" y="194" width="28" height="4" rx="2" fill="#D4562D"/>
    <text x="281.3" y="244" fill="#1F2328" font-size="36" font-weight="600" letter-spacing="-.8">10 ms</text>
    <text x="281.3" y="278" fill="#31363C" font-size="23" font-weight="600">to first view</text>
    <text x="281.3" y="306" fill="#59636E" font-size="20">fills in as it scans</text>
    <rect x="515.2" y="172.5" width="244.3" height="155" rx="16" fill="#F6F8FA" fill-opacity="1" stroke="#D1D9E0" stroke-opacity="1"/>
    <rect x="538.7" y="194" width="28" height="4" rx="2" fill="#D4562D"/>
    <text x="538.7" y="244" fill="#1F2328" font-size="36" font-weight="600" letter-spacing="-.8">120 Hz</text>
    <text x="538.7" y="278" fill="#31363C" font-size="23" font-weight="600">smooth UI</text>
    <text x="538.7" y="306" fill="#59636E" font-size="20">p99 interval 6.2 ms</text>
  </g>
</svg>
