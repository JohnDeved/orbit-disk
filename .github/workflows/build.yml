name: Build
on:
  push:
    branches: [main, rust-port]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build:
    name: Release-mode app bundle
    needs: checks
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show build toolchain
        run: |
          xcodebuild -version
          rustup show active-toolchain && rustc --version
      - name: Ensure the Metal toolchain (precompiled shaders)
        run: |
          xcrun -sdk macosx metal --version 2>/dev/null || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build app
        run: ./build-app.sh --release-mode --output 'target/ci/Orbit Disk.app'
      - name: Check the bundle
        run: |
          python3 scripts/validate-release.py --print-version
          codesign --verify --deep --strict 'target/ci/Orbit Disk.app'
          'target/ci/Orbit Disk.app/Contents/MacOS/OrbitControl' --version
          python3 -I Tests/test_mcp.py 'target/ci/Orbit Disk.app/Contents/MacOS/OrbitControl'
      - name: Rehearse Developer ID signing (ad-hoc, hardened runtime)
        run: |
          ditto 'target/ci/Orbit Disk.app' 'target/ci/rehearsal/Orbit Disk.app'
          ./scripts/sign-release.sh 'target/ci/rehearsal/Orbit Disk.app' --dry-run
      - name: Check disk image packaging
        run: |
          ./scripts/package-dmg.sh 'target/ci/Orbit Disk.app' target/ci/Orbit-Disk.dmg
          test -s target/ci/Orbit-Disk.dmg
          python3 scripts/test-package-dmg.py 'target/ci/Orbit Disk.app'
      - name: Archive app with framework symlinks
        run: ditto -c -k --sequesterRsrc --keepParent 'target/ci/Orbit Disk.app' target/ci/Orbit-Disk.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Orbit-Disk-${{ github.sha }}
          path: target/ci/Orbit-Disk.zip
          if-no-files-found: error
          retention-days: 14
