name: Rust
on:
  push:
    branches: [rust-port]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  macos:
    name: macOS (fmt, clippy, tests, boundary)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Platform boundary
        run: ./scripts/checks/check-platform-boundary.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run --locked
  linux-portable:
    name: Linux (portable engine on generic platform)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Engine and pure crates
        run: >-
          cargo nextest run --locked --no-fail-fast
          -p orbit-platform -p orbit-platform-generic -p orbit-core
          -p orbit-sunburst -p orbit-app-state -p orbit-automation
