name: Refresh README screenshots

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: readme-screenshots
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  capture:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Ensure the Metal toolchain (precompiled shaders)
        run: |
          xcrun -sdk macosx metal --version 2>/dev/null || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version
      - name: Build the app
        working-directory: source
        run: ./build-app.sh --release-mode --output "$RUNNER_TEMP/capture/Orbit Disk.app"
      - name: Capture the app's fixture states
        id: capture
        working-directory: source
        run: |
          capture_status=0
          ./scripts/capture-marketing.sh --app "$RUNNER_TEMP/capture/Orbit Disk.app" || capture_status=$?
          if (( capture_status == 3 )); then
            echo '::warning::OrbitDisk has no --marketing-state mode yet; README screenshots were not refreshed.'
            echo 'captured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          (( capture_status == 0 )) || exit "$capture_status"
          echo 'captured=true' >> "$GITHUB_OUTPUT"
        shell: zsh {0}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.capture.outputs.captured == 'true'
        with:
          ref: main
          path: publish
      - name: Commit updated screenshots
        if: steps.capture.outputs.captured == 'true'
        working-directory: publish
        run: |
          images=(docs/screenshots/orbit-overview.png docs/screenshots/orbit-collection.png docs/art/orbit-navigate-light.png docs/art/orbit-navigate-dark.png docs/art/orbit-collect-light.png docs/art/orbit-collect-dark.png)
          for path in "${images[@]}"; do cp "../source/$path" "$path"; done
          git add "${images[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update README screenshots'
          git pull --rebase origin main
          git push origin HEAD:main
