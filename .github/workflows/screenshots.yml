name: Refresh README screenshots

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: readme-screenshots
  cancel-in-progress: false

jobs:
  capture:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
      - name: Render the app with sample data
        working-directory: source
        run: ./scripts/capture-marketing.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: publish
      - name: Commit updated screenshots
        working-directory: publish
        run: |
          images=(docs/screenshots/orbit-overview.png docs/screenshots/orbit-collection.png docs/art/orbit-navigate-light.png docs/art/orbit-navigate-dark.png docs/art/orbit-collect-light.png docs/art/orbit-collect-dark.png)
          for path in "${images[@]}"; do cp "../source/$path" "$path"; done
          git add "${images[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update README screenshots'
          git pull --rebase origin main
          git push origin HEAD:main
