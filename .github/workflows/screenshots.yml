name: Refresh README screenshots

on:
  workflow_call:
  # A manual run captures without publishing unless asked to, to check the capture path.
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the refreshed screenshots to main
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: readme-screenshots
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  capture:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Ensure the Metal toolchain (precompiled shaders)
        run: |
          xcrun -sdk macosx metal --version 2>/dev/null || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version
      - name: Fit the display to the capture window
        # Runners boot into a small 1x mode that cuts the 1280x810 window short.
        working-directory: source
        run: |
          osascript -l JavaScript scripts/marketing/display.js 1280 810
          echo 'After the script exited:'
          osascript -l JavaScript scripts/marketing/display.js | grep '^screen'
      - name: Build the app
        working-directory: source
        run: ./build-app.sh --release-mode --output "$RUNNER_TEMP/capture/Orbit Disk.app"
      - name: Capture the app's fixture states
        id: capture
        working-directory: source
        run: |
          capture_status=0
          ./scripts/capture-marketing.sh --app "$RUNNER_TEMP/capture/Orbit Disk.app" || capture_status=$?
          if (( capture_status == 3 )); then
            echo '::warning::OrbitDisk has no --marketing-state mode yet; README screenshots were not refreshed.'
            echo 'captured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          (( capture_status == 0 )) || exit "$capture_status"
          echo 'captured=true' >> "$GITHUB_OUTPUT"
        shell: zsh {0}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.capture.outputs.captured == 'true'
        with:
          name: readme-screenshots
          path: |
            source/docs/screenshots
            source/docs/art
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.capture.outputs.captured == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        with:
          ref: main
          path: publish
      - name: Commit updated screenshots
        if: steps.capture.outputs.captured == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        working-directory: publish
        run: |
          images=(docs/screenshots/orbit-hero-{light,dark}.png docs/art/card-{map,collect,review}-{light,dark}.png)
          for path in "${images[@]}"; do cp "../source/$path" "$path"; done
          git add "${images[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update README screenshots'
          git pull --rebase origin main
          git push origin HEAD:main
