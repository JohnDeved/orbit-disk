[package]
name = "orbit-core"
description = "Scan engine: discovery, live inventory, durable SQLite index, search, removal journal and recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit-platform.workspace = true
parking_lot.workspace = true
crossbeam-deque.workspace = true
crossbeam-channel.workspace = true
memchr.workspace = true
smallvec.workspace = true
rusqlite.workspace = true
sha2.workspace = true
uuid.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
caseless.workspace = true
# Discovery/live: index of directory nodes keyed by (parent, name) hash, without storing paths.
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }
foldhash = "0.1"
# Name-sort collation (numeric, locale-aware); see `collate`.
icu_collator = "2.4"
icu_locale_core = "2.4"

# The removal journal needs `openat`/`unlinkat`/`fdopendir`, which `orbit_platform::posix` does not
# expose yet. All uses live in `journal::sys` and are portable POSIX.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
orbit-native.workspace = true

[lints]
workspace = true
